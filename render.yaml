# Render Blueprint for the GraphQL API.
# Applying this file creates a Free web service. It does not create paid compute.
# Free instances spin down after 15 minutes without inbound traffic.
# Set MONGODB_URI, EDITOR_AUTH_SECRET, and ADMIN_GITHUB_IDS in the dashboard. Never put them in this file.
services:
  - type: web
    name: alex-blog-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_DB
        value: alex_blog
      - key: CORS_ORIGINS
        value: https://www.alexgarulli.org.uk,https://alexgarulli.org.uk,http://localhost:3000
      - key: MONGODB_URI
        sync: false
      - key: EDITOR_AUTH_SECRET
        sync: false
      - key: ADMIN_GITHUB_IDS
        sync: false
